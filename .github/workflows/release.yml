name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION
        run: |
          version="$(<VERSION)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      # Without a certificate the app is ad-hoc signed, and macOS asks for Accessibility again after each update.
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build app
        run: |
          if [[ -z "$MACOS_CERTIFICATE_P12" ]]; then
            mode=adhoc
          elif [[ -n "$NOTARY_APPLE_ID" ]]; then
            mode=developer-id
          else
            mode=self-signed
          fi
          echo "Signing mode: $mode"
          SIGNING_MODE="$mode" APP_ARCH=universal BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./scripts/build-app.sh
          echo "SIGNING_MODE=$mode" >> "$GITHUB_ENV"

      - name: Build DMG
        run: echo "DMG=$(./scripts/build-dmg.sh | tail -n 1)" >> "$GITHUB_ENV"

      - name: Notarize
        if: env.SIGNING_MODE == 'developer-id'
        run: |
          xcrun notarytool submit "$DMG" --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple "$DMG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd "$(dirname "$DMG")" && shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256")
          gh release create "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" \
            --title "Hopp $VERSION" --generate-notes
