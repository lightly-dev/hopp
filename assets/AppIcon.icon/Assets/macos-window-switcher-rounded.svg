<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-label="macOS 多窗口切换应用图标，蓝紫渐变背景与三个圆角叠层窗口">
  <defs>
    <linearGradient id="background" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8E61F8"/>
      <stop offset="0.25" stop-color="#4D55F2"/>
      <stop offset="0.56" stop-color="#247DF7"/>
      <stop offset="1" stop-color="#15D9F6"/>
    </linearGradient>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1" y2="0.85">
      <stop offset="0" stop-color="#367EFF" stop-opacity=".36"/>
      <stop offset=".54" stop-color="#1A9BF7" stop-opacity=".1"/>
      <stop offset="1" stop-color="#00D6ED" stop-opacity=".24"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#A36BFE" stop-opacity=".85"/>
      <stop offset=".37" stop-color="#5866F7" stop-opacity=".28"/>
      <stop offset="1" stop-color="#079AF7" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9758F6" stop-opacity=".78"/>
      <stop offset=".55" stop-color="#375CF4" stop-opacity=".35"/>
      <stop offset="1" stop-color="#169CF7" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="rearPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CCEFFF"/>
      <stop offset=".58" stop-color="#92D4FB"/>
      <stop offset="1" stop-color="#5DB6F7"/>
    </linearGradient>
    <linearGradient id="middlePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFFAFF"/>
      <stop offset=".52" stop-color="#C5E1FD"/>
      <stop offset="1" stop-color="#98BFF6"/>
    </linearGradient>
    <linearGradient id="frontPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#F1F6FF"/>
      <stop offset="1" stop-color="#DEE8FF"/>
    </linearGradient>
    <linearGradient id="redDot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6158"/><stop offset="1" stop-color="#FF4547"/>
    </linearGradient>
    <linearGradient id="yellowDot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD24A"/><stop offset="1" stop-color="#FFB824"/>
    </linearGradient>
    <linearGradient id="greenDot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42E56A"/><stop offset="1" stop-color="#1FCB4C"/>
    </linearGradient>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="blur"/>
      <feOffset dy="9" result="offset"/>
      <feComponentTransfer in="offset" result="shadow"><feFuncA type="linear" slope=".13"/></feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Full-bleed, sharp-corner square background. -->
  <rect width="1254" height="1254" fill="url(#background)"/>
  <rect width="1254" height="1254" fill="url(#bgLight)"/>
  <!-- Broad overlapping vector color ribbons. -->
  <path d="M0 913 C190 748 361 722 567 690 C810 651 1097 580 1254 357 L1254 1254 H0 Z" fill="url(#wave1)"/>
  <path d="M0 1199 C176 1050 338 981 548 941 C822 890 1077 805 1254 622 V1254 H0 Z" fill="url(#wave2)"/>
  <!-- Three independently editable window cards, with rounded corners. -->
  <rect x="235" y="279" width="576" height="434" rx="45" fill="url(#rearPanel)" filter="url(#panelShadow)"/>
  <rect x="336" y="379" width="576" height="443" rx="46" fill="url(#middlePanel)" filter="url(#panelShadow)"/>
  <rect x="436" y="484" width="578" height="450" rx="47" fill="url(#frontPanel)" filter="url(#panelShadow)"/>
  <!-- Native macOS close / minimize / maximize controls. -->
  <circle cx="493" cy="544" r="21" fill="url(#redDot)"/>
  <circle cx="559" cy="544" r="21" fill="url(#yellowDot)"/>
  <circle cx="625" cy="544" r="21" fill="url(#greenDot)"/>
</svg>
